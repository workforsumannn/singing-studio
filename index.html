<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Singing Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header>
    <h1>🎤 My Singing Studio</h1>
    <p>Apni awaaz ko studio-level polish do</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="record">🎙️ Record</button>
    <button class="tab" data-tab="upload">📁 Upload</button>
  </div>

  <section id="record-panel" class="panel active">
    <button id="micBtn" class="mic-btn">🎤</button>
    <div id="timer" class="timer">00:00</div>
    <p id="recStatus" class="status">Mic dabao aur gaana shuru karo</p>
  </section>

  <section id="upload-panel" class="panel">
    <div id="dropZone" class="drop-zone">
      <p>📁 Audio file yahan drop karo ya click karo</p>
      <input type="file" id="fileInput" accept="audio/*" hidden>
    </div>
    <p id="fileName" class="filename"></p>
  </section>

  <section class="controls">
    <div class="control">
      <label>🎵 Autotune <span id="tuneVal">70%</span></label>
      <input type="range" id="tuneRange" min="0" max="100" value="70">
    </div>
    <div class="control">
      <label>🎚️ Reverb <span id="reverbVal">40%</span></label>
      <input type="range" id="reverbRange" min="0" max="100" value="40">
    </div>
    <div class="control">
      <label>🎸 Guitar <span id="guitarVal">30%</span></label>
      <input type="range" id="guitarRange" min="0" max="100" value="30">
    </div>
    <div class="toggle">
      <span>🎸 Guitar Backing</span>
      <input type="checkbox" id="guitarToggle" checked>
    </div>
    <div class="toggle">
      <span>✨ Studio Compression</span>
      <input type="checkbox" id="compToggle" checked>
    </div>
  </section>

  <button id="processBtn" class="process-btn" disabled>
    ✨ Studio Magic Apply Karo
  </button>

  <div id="loading" class="loading">Processing... thoda wait karo</div>

  <section id="result" class="result">
    <h3>✅ Ready! Aapka Studio Version</h3>
    <audio id="resultAudio" controls></audio>
    <button id="downloadBtn" class="download-btn">⬇️ Download WAV</button>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
